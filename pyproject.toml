[project]
name = "twin-downloader-pro"
version = "0.6.10"
description = "Professional Windows media control center for yt-dlp, N_m3u8DL-RE, FFmpeg/FFprobe and Bento4 with advanced extraction, streaming, processing, queueing and diagnostics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.scripts]
twin-downloader-pro = "twin_downloader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_downloader"]
